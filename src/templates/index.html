<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Predictor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, 0.58), rgba(0, 0, 0, 0.68)),
                url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=2000&q=80")
                center / cover fixed;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.85;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            color: white;
            font-size: 14px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: none;
            border-radius: 10px;
            outline: none;
            background: rgba(255, 255, 255, 0.92);
            font-size: 15px;
        }

        input:focus,
        select:focus {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        .button-container {
            margin-top: 25px;
            text-align: center;
        }

        button {
            border: none;
            padding: 14px 45px;
            border-radius: 12px;
            background: white;
            color: #222;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        #result {
            display: none;
            margin-top: 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 22px;
            color: white;
        }

        #result h2 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        #price {
            font-size: 32px;
            font-weight: bold;
        }

        #error {
            display: none;
            margin-top: 15px;
            text-align: center;
            color: #ffdddd;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 30px;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🏠 House Price Predictor</h1>
        <p>AI-powered property price estimation</p>
    </div>

    <div class="form-grid">

        <div class="field">
            <label>Size (sqft)</label>
            <input type="number" id="Size_sqft" value="1500">
        </div>

        <div class="field">
            <label>Bedrooms</label>
            <input type="number" id="Bedrooms" value="3">
        </div>

        <div class="field">
            <label>Bathrooms</label>
            <input type="number" id="Bathrooms" value="3">
        </div>

        <div class="field">
            <label>Floors</label>
            <input type="number" id="Floors" value="2">
        </div>

        <div class="field">
            <label>Property Type</label>
            <select id="Property_Type">
                <option>Apartment</option>
                <option>Row House</option>
            </select>
        </div>

        <div class="field">
            <label>Price / sqft (₹)</label>
            <input type="number" id="Price_per_sqft" value="8500">
        </div>

        <div class="field">
            <label>Property Age (years)</label>
            <input type="number" id="Property_Age_years" value="5">
        </div>

        <div class="field">
            <label>Distance to City Center (km)</label>
            <input type="number" id="Distance_to_City_Center_km" value="6">
        </div>

        <div class="field">
            <label>Parking Spaces</label>
            <input type="number" id="Parking_Spaces" value="2">
        </div>

        <div class="field">
            <label>Furnished Status</label>
            <select id="Furnished_Status">
                <option>Unfurnished</option>
                <option selected>Semi-Furnished</option>
                <option>Fully-Furnished</option>
            </select>
        </div>

        <div class="field">
            <label>Location Quality</label>
            <select id="Location_Quality">
                <option>Low</option>
                <option>Medium</option>
                <option selected>High</option>
                <option>Premium</option>
            </select>
        </div>

    </div>

    <div class="button-container">
        <button onclick="predictPrice()">Predict Price</button>
    </div>

    <div id="result">
        <h2>Estimated Property Price</h2>
        <div id="price"></div>
    </div>

    <div id="error"></div>

</div>

<script>

async function predictPrice() {

    const resultBox = document.getElementById("result");
    const priceBox = document.getElementById("price");
    const errorBox = document.getElementById("error");

    resultBox.style.display = "none";
    errorBox.style.display = "none";

    const data = {
        Size_sqft: Number(document.getElementById("Size_sqft").value),
        Bedrooms: Number(document.getElementById("Bedrooms").value),
        Bathrooms: Number(document.getElementById("Bathrooms").value),
        Floors: Number(document.getElementById("Floors").value),
        Property_Type: document.getElementById("Property_Type").value,
        Price_per_sqft: Number(document.getElementById("Price_per_sqft").value),
        Property_Age_years: Number(document.getElementById("Property_Age_years").value),
        Distance_to_City_Center_km: Number(document.getElementById("Distance_to_City_Center_km").value),
        Parking_Spaces: Number(document.getElementById("Parking_Spaces").value),
        Furnished_Status: document.getElementById("Furnished_Status").value,
        Location_Quality: document.getElementById("Location_Quality").value
    };

    try {

        const response = await fetch("/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.detail || "Prediction failed");
        }

        const formattedPrice = new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: "INR",
            maximumFractionDigits: 0
        }).format(result.predicted_price_INR);

        priceBox.textContent = formattedPrice;
        resultBox.style.display = "block";

    } catch (error) {

        errorBox.textContent = error.message;
        errorBox.style.display = "block";
    }
}

</script>

<p style="position:fixed; bottom:15px; left:0; right:0; text-align:center; color:white; font-size:16px; font-weight:600; margin:0; z-index:9999;">MLOps CI/CD Deployment Test</p></body>
</html>
